<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80"><style>@keyframes hop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.1)}}@keyframes ring{0%,100%{opacity:0;r:22}60%{opacity:1;r:28}}.i{animation:hop 2.8s ease-in-out 0.0s infinite;transform-origin:center}.ring{fill:none;stroke:#0077b5;stroke-width:2;opacity:0;r:22;cx:32;cy:44}.wrap:hover .ring{animation:ring .6s ease-out forwards}.wrap:hover .i{animation:hop .5s ease-out}@media (prefers-reduced-motion:reduce){.i{animation:none}.ring{display:none}}</style><g class="wrap"><image class="i" href="data:image/svg+xml;base64," x="8" y="16" width="48" height="48"/><circle class="ring"/></g></svg>