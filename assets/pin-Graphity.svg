<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 120" width="390" height="120" role="img" aria-label="Graphity">
  <defs>
    <!-- Orange & Black Container Base -->
    <linearGradient id="card-bg-Graphity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#140d06"/>
      <stop offset="100%" stop-color="#070503"/>
    </linearGradient>
    <linearGradient id="orange-glow-Graphity" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="50%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="ambient-Graphity" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <style>
      * { box-sizing: border-box; }
      .card-Graphity { fill: url(#card-bg-Graphity); stroke: #ff6a00; stroke-width: 1.2; rx: 10px; animation: borderGlow-Graphity 3s ease-in-out infinite alternate; }
      .ambient-glow-Graphity { fill: url(#ambient-Graphity); rx: 10px; }
      .top-line-Graphity { stroke: url(#orange-glow-Graphity); stroke-width: 2.5; stroke-linecap: round; }
      .repo-icon-Graphity { fill: #ff7700; }
      .title-Graphity { font-family: Consolas, "SFMono-Regular", "Liberation Mono", Menlo, monospace; font-size: 14.5px; font-weight: 700; fill: #ff8533; letter-spacing: -0.2px; }
      .badge-bg-Graphity { fill: #1c1005; stroke: #ff7700; stroke-width: 0.8; stroke-opacity: 0.75; }
      .badge-text-Graphity { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 9.5px; font-weight: 600; fill: #ffa24c; text-anchor: middle; }
      .desc-Graphity { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #c9d1d9; }
      .meta-Graphity { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 11px; fill: #8b949e; }
      .meta-val-Graphity { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 11px; font-weight: 600; fill: #e6edf3; }
      .star-icon-Graphity { fill: #ffb703; }
      .fork-icon-Graphity { fill: #ff7700; }
      .pulse-dot-Graphity { fill: #ff6a00; animation: pulse-Graphity 1.8s ease-in-out infinite; }
      @keyframes borderGlow-Graphity {
        0% { stroke: #ff5500; stroke-opacity: .45; }
        50% { stroke: #ff9900; stroke-opacity: .95; }
        100% { stroke: #ff5500; stroke-opacity: .45; }
      }
      @keyframes pulse-Graphity {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @media (prefers-reduced-motion: reduce) { .card-Graphity, .pulse-dot-Graphity { animation: none !important; } }
    </style>
  </defs>
  <rect class="card-Graphity" x="1" y="1" width="388" height="118"/>
  <rect class="ambient-glow-Graphity" x="1" y="1" width="388" height="118"/>
  <line class="top-line-Graphity" x1="14" y1="2" x2="150" y2="2"/>
  <g transform="translate(18, 19)">
    <svg class="repo-icon-Graphity" viewBox="0 0 16 16" width="16" height="16">
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5v-9zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8V1.5zM5 12.25a.25.25 0 0 1 .25-.25h5.5a.25.25 0 0 1 .25.25v.5a.25.25 0 0 1-.25.25h-5.5a.25.25 0 0 1-.25-.25v-.5z"/>
    </svg>
  </g>
  <text class="title-Graphity" x="42" y="32">Graphity</text>
  <!-- Live Activity Badge -->
  <rect class="badge-bg-Graphity" x="295" y="18" width="78" height="18" rx="9"/>
  <circle class="pulse-dot-Graphity" cx="305" cy="27" r="3.2"/>
  <text class="badge-text-Graphity" x="339" y="30.5">Jul 2026</text>
  <text class="desc-Graphity" x="20" y="58">Markdown knowledge graph builder that turns</text>
  <text class="desc-Graphity" x="20" y="75">notes into a navigable visual web.</text>
  <circle cx="24" cy="99" r="4.5" fill="#e34c26"/>
  <text class="meta-Graphity" x="34" y="103">HTML</text>
  <g transform="translate(130, 91)">
    <svg class="star-icon-Graphity" viewBox="0 0 16 16" width="14" height="14">
      <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/>
    </svg>
  </g>
  <text class="meta-val-Graphity" x="148" y="103">1</text>
  <g transform="translate(180, 91)">
    <svg class="fork-icon-Graphity" viewBox="0 0 16 16" width="14" height="14">
      <path d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0zm0 2.122a2.25 2.25 0 1 0-1.5 0v.878A2.25 2.25 0 0 0 5.75 8.5h1.5v2.128a2.251 2.251 0 1 0 1.5 0V8.5h1.5a2.25 2.25 0 0 0 2.25-2.25v-.878a2.25 2.25 0 1 0-1.5 0v.878a.75.75 0 0 1-.75.75h-4.5A.75.75 0 0 1 5 6.25v-.878zm3.75 7.378a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0zm3-8.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0z"/>
    </svg>
  </g>
  <text class="meta-val-Graphity" x="198" y="103">0</text>
</svg>