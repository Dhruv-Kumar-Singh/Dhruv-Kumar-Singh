<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 211" width="800" height="211" role="img" aria-label="Dhruv-Kumar-Singh&#x27;s GitHub Trophies"><style>
*{font-family:Consolas,"SFMono-Regular","Liberation Mono",Menlo,monospace}
.panel{fill:#0d1117;stroke:#00ff41;stroke-opacity:.35}
.title{fill:#00ff41;font-size:14px;font-weight:600}
.cat{fill:#00ff41;font-size:12.5px;font-weight:600}
.muted{fill:#8b949e;font-size:10.5px}
.lbl{fill:#8b949e;font-size:10.5px;text-anchor:middle}
.val{fill:#e6edf3;font-size:22px;font-weight:700;text-anchor:middle}
.sub{fill:#8b949e;font-size:10px;text-anchor:middle}
.tile{fill:#161b22;stroke:#30363d}
.tile.live{stroke:#00ff41;animation:glow 2.4s ease-in-out infinite alternate}
.dot{fill:#00ff41;animation:pulse 1.6s ease-in-out infinite}
.cursor{fill:#00ff41;animation:blink 1s steps(1) infinite}
.enter{opacity:0;animation:enter .6s ease-out forwards}
.float{animation:float 3.2s ease-in-out infinite}
.white{filter:brightness(0) invert(1)}
.big{fill:#00ff41;font-size:28px;font-weight:700;text-anchor:middle}
.card{fill:#161b22;stroke:#00ff41;stroke-opacity:.4;animation:glow 3s ease-in-out infinite alternate}
.bar-bg{fill:#161b22}
.bar-label{fill:#c9d1d9;font-size:12.5px;font-weight:600}
.bar-pct{font-size:11px;font-weight:600}
.streak-val{fill:#00ff41;font-size:32px;font-weight:700;text-anchor:middle}
.streak-lbl{fill:#8b949e;font-size:11px;text-anchor:middle}
.streak-sub{fill:#e6edf3;font-size:10px;text-anchor:middle}
.stat-val{fill:#00ff41;font-size:24px;font-weight:700;text-anchor:middle}
.stat-lbl{fill:#8b949e;font-size:10px;text-anchor:middle}
.stat-icon{font-size:18px;text-anchor:middle}
.trophy-val{font-size:20px;font-weight:700;text-anchor:middle}
.trophy-lbl{fill:#8b949e;font-size:9.5px;text-anchor:middle}
.trophy-tier{font-size:9px;font-weight:600;text-anchor:middle}
.shimmer{animation:shimmer 2s ease-in-out infinite}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glow{from{stroke-opacity:.3}to{stroke-opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes countin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect class="panel" x="0.5" y="0.5" width="799" height="210" rx="14"/><text class="title" x="28" y="28">$ ls ~/trophies<tspan class="cursor"> ▌</tspan></text><line x1="28" y1="36" x2="772" y2="36" stroke="#21262d" stroke-width="1"/><g class="enter" style="animation-delay:0.0s"><rect x="16.0" y="44.0" width="118" height="105" rx="10" fill="#161b22" stroke="#a8b4c0" stroke-opacity=".7"/><text font-size="26" text-anchor="middle" x="75.0" y="77">🔥</text><text class="trophy-val" fill="#a8b4c0" style="animation:none 2s ease-in-out infinite" x="75.0" y="102">56</text><text class="trophy-lbl" x="75.0" y="117">Commits</text><rect x="53.0" y="129.0" width="44" height="15" rx="7" fill="#a8b4c0" fill-opacity=".18"/><text class="trophy-tier" fill="#a8b4c0" x="75.0" y="140.0">Silver</text></g><g class="enter" style="animation-delay:0.1s"><rect x="146.0" y="44.0" width="118" height="105" rx="10" fill="#161b22" stroke="#cd7f32" stroke-opacity=".7"/><text font-size="26" text-anchor="middle" x="205.0" y="77">🔀</text><text class="trophy-val" fill="#cd7f32" style="animation:none 2s ease-in-out infinite" x="205.0" y="102">4</text><text class="trophy-lbl" x="205.0" y="117">Pull Req</text><rect x="183.0" y="129.0" width="44" height="15" rx="7" fill="#cd7f32" fill-opacity=".18"/><text class="trophy-tier" fill="#cd7f32" x="205.0" y="140.0">Bronze</text></g><g class="enter" style="animation-delay:0.2s"><rect x="276.0" y="44.0" width="118" height="105" rx="10" fill="#161b22" stroke="#cd7f32" stroke-opacity=".7"/><text font-size="26" text-anchor="middle" x="335.0" y="77">⭐</text><text class="trophy-val" fill="#cd7f32" style="animation:none 2s ease-in-out infinite" x="335.0" y="102">2</text><text class="trophy-lbl" x="335.0" y="117">Stars</text><rect x="313.0" y="129.0" width="44" height="15" rx="7" fill="#cd7f32" fill-opacity=".18"/><text class="trophy-tier" fill="#cd7f32" x="335.0" y="140.0">Bronze</text></g><g class="enter" style="animation-delay:0.3s"><rect x="406.0" y="44.0" width="118" height="105" rx="10" fill="#161b22" stroke="#cd7f32" stroke-opacity=".7"/><text font-size="26" text-anchor="middle" x="465.0" y="77">👥</text><text class="trophy-val" fill="#cd7f32" style="animation:none 2s ease-in-out infinite" x="465.0" y="102">2</text><text class="trophy-lbl" x="465.0" y="117">Followers</text><rect x="443.0" y="129.0" width="44" height="15" rx="7" fill="#cd7f32" fill-opacity=".18"/><text class="trophy-tier" fill="#cd7f32" x="465.0" y="140.0">Bronze</text></g><g class="enter" style="animation-delay:0.4s"><rect x="536.0" y="44.0" width="118" height="105" rx="10" fill="#161b22" stroke="#cd7f32" stroke-opacity=".7"/><text font-size="26" text-anchor="middle" x="595.0" y="77">📦</text><text class="trophy-val" fill="#cd7f32" style="animation:none 2s ease-in-out infinite" x="595.0" y="102">5</text><text class="trophy-lbl" x="595.0" y="117">Repos</text><rect x="573.0" y="129.0" width="44" height="15" rx="7" fill="#cd7f32" fill-opacity=".18"/><text class="trophy-tier" fill="#cd7f32" x="595.0" y="140.0">Bronze</text></g><g class="enter" style="animation-delay:0.5s"><rect x="666.0" y="44.0" width="118" height="105" rx="10" fill="#161b22" stroke="#cd7f32" stroke-opacity=".7"/><text font-size="26" text-anchor="middle" x="725.0" y="77">🐛</text><text class="trophy-val" fill="#cd7f32" style="animation:none 2s ease-in-out infinite" x="725.0" y="102">1</text><text class="trophy-lbl" x="725.0" y="117">Issues</text><rect x="703.0" y="129.0" width="44" height="15" rx="7" fill="#cd7f32" fill-opacity=".18"/><text class="trophy-tier" fill="#cd7f32" x="725.0" y="140.0">Bronze</text></g></svg>