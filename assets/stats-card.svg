<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="Dhruv-Kumar-Singh&#x27;s GitHub Stats"><style>
*{font-family:Consolas,"SFMono-Regular","Liberation Mono",Menlo,monospace}
.panel{fill:#0d1117;stroke:#00ff41;stroke-opacity:.35}
