<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 266" width="800" height="266" role="img" aria-label="Most used languages across my repositories"><style>
text{font-family:'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
.panel{fill:#0d1117;stroke:#00ff41;stroke-opacity:.35}
.title{fill:#00ff41;font-size:15px;font-weight:600}
.cat{fill:#00ff41;font-size:12.5px;font-weight:600}
.muted{fill:#8b949e;font-size:10.5px}
.lbl{fill:#8b949e;font-size:10.5px;text-anchor:middle}
.tile{fill:#161b22;stroke:#30363d;transition:all .3s}
.tile.live{stroke:#00ff41;animation:glow 2.4s ease-in-out infinite alternate}
.dot{fill:#00ff41;animation:pulse 1.6s ease-in-out infinite}
.cursor{fill:#00ff41;animation:blink 1s steps(1) infinite}
.enter{opacity:0;animation:enter .6s ease-out forwards}
.float{animation:float 3.2s ease-in-out infinite}
.white{filter:brightness(0) invert(1)}
.big{fill:#00ff41;font-size:30px;font-weight:700}
.card{fill:#161b22;stroke:#00ff41;stroke-opacity:.4;animation:glow 3s ease-in-out infinite alternate}
.bar-bg{fill:#161b22}
.bar-label{fill:#c9d1d9;font-size:12.5px;font-weight:600}
.bar-pct{font-size:11px;font-weight:600}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glow{from{stroke-opacity:.3}to{stroke-opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect class="panel" x="0.5" y="0.5" width="799" height="265" rx="14"/><text class="title" x="28" y="34">$ cloc ~/repos<tspan class="cursor"> ▌</tspan></text><defs><linearGradient id="g0" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#f1e05a"/><stop offset="100%" stop-color="#f1e05a" stop-opacity="0.55"/></linearGradient></defs><g class="enter" style="animation-delay:0.00s"><text class="bar-label" x="28" y="75">JavaScript</text><rect class="bar-bg" x="200" y="62" width="460" height="16" rx="8"/><rect x="200" y="62" width="0" height="16" rx="8" fill="url(#g0)"><animate attributeName="width" from="0" to="236.3" dur="1.2s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text class="bar-pct" x="672" y="75" fill="#f1e05a">51.4%</text></g><defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#3178c6"/><stop offset="100%" stop-color="#3178c6" stop-opacity="0.55"/></linearGradient></defs><g class="enter" style="animation-delay:0.12s"><text class="bar-label" x="28" y="107">TypeScript</text><rect class="bar-bg" x="200" y="94" width="460" height="16" rx="8"/><rect x="200" y="94" width="0" height="16" rx="8" fill="url(#g1)"><animate attributeName="width" from="0" to="162.9" dur="1.2s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text class="bar-pct" x="672" y="107" fill="#3178c6">35.4%</text></g><defs><linearGradient id="g2" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#563d7c"/><stop offset="100%" stop-color="#563d7c" stop-opacity="0.55"/></linearGradient></defs><g class="enter" style="animation-delay:0.24s"><text class="bar-label" x="28" y="139">CSS</text><rect class="bar-bg" x="200" y="126" width="460" height="16" rx="8"/><rect x="200" y="126" width="0" height="16" rx="8" fill="url(#g2)"><animate attributeName="width" from="0" to="24.2" dur="1.2s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text class="bar-pct" x="672" y="139" fill="#563d7c">5.3%</text></g><defs><linearGradient id="g3" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#3572A5"/><stop offset="100%" stop-color="#3572A5" stop-opacity="0.55"/></linearGradient></defs><g class="enter" style="animation-delay:0.36s"><text class="bar-label" x="28" y="171">Python</text><rect class="bar-bg" x="200" y="158" width="460" height="16" rx="8"/><rect x="200" y="158" width="0" height="16" rx="8" fill="url(#g3)"><animate attributeName="width" from="0" to="20.3" dur="1.2s" begin="0.36s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text class="bar-pct" x="672" y="171" fill="#3572A5">4.4%</text></g><defs><linearGradient id="g4" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#e34c26"/><stop offset="100%" stop-color="#e34c26" stop-opacity="0.55"/></linearGradient></defs><g class="enter" style="animation-delay:0.48s"><text class="bar-label" x="28" y="203">HTML</text><rect class="bar-bg" x="200" y="190" width="460" height="16" rx="8"/><rect x="200" y="190" width="0" height="16" rx="8" fill="url(#g4)"><animate attributeName="width" from="0" to="16.2" dur="1.2s" begin="0.48s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text class="bar-pct" x="672" y="203" fill="#e34c26">3.5%</text></g><defs><linearGradient id="g5" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#00ff41"/><stop offset="100%" stop-color="#00ff41" stop-opacity="0.55"/></linearGradient></defs><g class="enter" style="animation-delay:0.60s"><text class="bar-label" x="28" y="235">Solidity</text><rect class="bar-bg" x="200" y="222" width="460" height="16" rx="8"/><rect x="200" y="222" width="0" height="16" rx="8" fill="url(#g5)"><animate attributeName="width" from="0" to="4" dur="1.2s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text class="bar-pct" x="672" y="235" fill="#00ff41">0.0%</text></g></svg>