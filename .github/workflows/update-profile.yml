name: Update Profile README

on:
  schedule:
    # Runs every 6 hours to keep stats real-time
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  update-readme:
    runs-on: ubuntu-latest
    name: Regenerate dynamic SVGs & README blocks
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run profile updater
        env:
          GH_USER: Dhruv-Kumar-Singh
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_profile.py

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git diff --cached --quiet || git commit -m "chore: auto-update profile assets [skip ci]"
          git push
